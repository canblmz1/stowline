[project]
name = "stowline-control"
version = "0.1.0"
description = "Stowline control plane (full pilot, not production 1.0)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",
  "cryptography>=43.0.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]
psycopg = ["psycopg[binary]>=3.2.0"]

[project.scripts]
stowline-server = "app.main:run"
stowline-worker = "app.worker:run"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# The admin panel's HTML/JS/CSS/fonts must ship inside the package: a
# non-editable install (systemd deployment) otherwise serves an empty panel.
[tool.setuptools.package-data]
app = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

